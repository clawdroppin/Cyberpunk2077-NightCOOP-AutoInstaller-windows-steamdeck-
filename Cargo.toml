[package]
name = "nightcoop-helper"
version = "0.2.0"
edition = "2024"
description = "Installs and updates the NightCoop co-op mod for Cyberpunk 2077 (Steam Deck, Linux, Windows)"
repository = "https://github.com/clawdroppin/Cyberpunk2077-NightCOOP-AutoInstaller-windows-steamdeck-"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
hex = "0.4.3"
open = "5.4.5"
pelite = "0.10.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust = "0.6.1"
sha2 = "0.11.1"
sysinfo = "0.39.6"
ureq = "3.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
